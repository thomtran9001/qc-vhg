 return `<div class="checkpoint" data-checkpoint="${c.id}">
  <div class="cp-head" data-cp-toggle="${c.id}">
   <div><b>${esc(c.name)}</b><small>${esc(c.spec)}${c.photoRequired?' · ảnh bắt buộc':''}</small></div>
   <span class="badge ${badge.cls}" data-cp-badge>${badge.label}</span>
   <div class="chev" style="transform:rotate(0deg)">${icon('chevronDown')}</div>
  </div>
  <div class="collapse-wrap collapsed" data-cp-wrap="${c.id}">
   <div class="collapse-body">
    <div class="measure-row">
     <div class="field" style="margin:0"><span>Giá trị thực tế${c.unit?` (${esc(c.unit)})`:''}</span><input class="control cp-value" data-cpid="${c.id}" value="${esc(c.value||'')}"></div>
     <div>
      <span class="label">Ảnh checkpoint</span>
      <button type="button" class="photo-btn ${hasPrevPhotos?'has':''}" data-cp-photo="${c.id}">${hasPrevPhotos?`${icon('check')} ${c.photoCount} ảnh`:icon('camera')+'Thêm ảnh'}</button>
      <input type="file" accept="image/*" multiple class="hidden cp-photo-input" data-cp-photo-input="${c.id}">
     </div>
    </div>
    <div class="photo-preview" data-cp-photo-preview="${c.id}">${hasPrevPhotos?ghostThumbs(c.photoCount):''}</div>
    <div class="pf">
     <button type="button" class="pass ${c.result==='pass'?'active':''}" data-result="${c.id}|pass">${icon('checkCircle')}PASS</button>
     <button type="button" class="fail ${c.result==='fail'?'active':''}" data-result="${c.id}|fail">${icon('xCircle')}FAIL</button>
    </div>
    <div class="fail-fields ${c.result==='fail'?'':'hidden'}" data-failfields="${c.id}">
     ${ncr&&isNcrOpen(ncr)?`<p class="helper" style="margin:0 0 8px">Đã mở <a href="#/ncr/${esc(ncr.id)}">${esc(ncr.id)}</a> cho lỗi này.</p>`:''}

   slot.querySelector('svg').outerHTML=icon('checkCircle');
  });
 });
 document.getElementById('cancelTask').addEventListener('click',()=>setRoute('work'));
 document.getElementById('saveQuality').addEventListener('click',()=>{
  // Đọc form vào dữ liệu trước, rồi mới kiểm tra.
  q.checks.forEach(c=>{
   const wrap=document.querySelector(`[data-checkpoint="${c.id}"]`);
   const valEl=wrap.querySelector('.cp-value');
   if(valEl)c.value=valEl.value;
   if(c.result==='fail'){
    c.affected=wrap.querySelector('.cp-affected').value;
    c.reason=wrap.querySelector('.cp-reason').value.trim();
    c.action=wrap.querySelector('.cp-action').value.trim();
    c.severity=wrap.querySelector('.cp-sev').value;
   }
  });
  const errs=[];
  q.checks.forEach(c=>{
   if(c.result!=='pass'&&c.result!=='fail')errs.push(`“${c.name}” chưa chấm PASS/FAIL.`);
   if(c.photoRequired&&!c.photoCount)errs.push(`“${c.name}” thiếu ảnh bắt buộc.`);
   if(c.result==='fail'&&!(Number(c.affected)>0))errs.push(`“${c.name}” FAIL: nhập số lượng ảnh hưởng.`);
   if(c.result==='fail'&&!c.reason)errs.push(`“${c.name}” FAIL: nhập lý do lỗi.`);
  });
  if(t.template!=='Re-check')EVIDENCE_SLOTS.filter(s=>s[2]).forEach(([k,n])=>{if(!q.photos[k])errs.push(`Thiếu ảnh bằng chứng “${n}”.`)});
  const box=document.getElementById('qcValidation');
  if(errs.length){box.innerHTML=validationBanner(errs);if(box.scrollIntoView)box.scrollIntoView({behavior:'smooth',block:'center'});return}
  box.innerHTML='';
  const created=[];
  if(t.template!=='Re-check'){
   q.checks.filter(c=>c.result==='fail').forEach(c=>{
    const ex=c.ncrId&&ncrById(c.ncrId);
    if(ex&&isNcrOpen(ex))return;
    const n=createNCR({po:t.po,kind:'quality',severity:c.severity||'major',group:ncrGroupFor(t),title:`${c.name}: ${c.reason}`,qty:c.affected,
     reason:c.reason,action:c.action,photos:c.photoCount||0,sourceTaskId:t.id,checkIds:[c.id]});
    c.ncrId=n.id;created.push(n);
   });
  }
  const recheck=t.ncrId?applyRecheckResult(t,q):null;
  const sc=scoreOf(q.checks);
  submitTask(t,[
   `${sc.passed}/${sc.total} checkpoint PASS · điểm QC ${sc.score}%`,
   ...created.map(n=>`Mở ${n.id} · ${n.title}`),
   recheck===true?`${t.ncrId} đạt — chờ QC trưởng đóng NCR`:recheck===false?`${t.ncrId} không đạt — trả về xưởng sửa lại`:''
  ].filter(Boolean));
  logHistory('checkCircle','Quality',`Gửi phiếu ${t.template} · ${sc.score}%`,t.po);
  save();
  toast(created.length?`Đã gửi phiếu · mở ${created.length} NCR`:recheck===false?'Re-check không đạt · NCR trả về xưởng':'Đã gửi phiếu QC');
  setTimeout(()=>setRoute('work'),500);
 });
}
function refreshScore(q){
 const {score}=scoreOf(q.checks);
 const ring=document.getElementById('scoreRing');
 if(ring){ring.style.background=`conic-gradient(${scoreColor(score)} 0 ${score}%, var(--surface-3) ${score}% 100%)`;document.getElementById('scoreText').textContent=score+'%'}
 document.querySelectorAll('[data-section]').forEach(secEl=>{
  const sec=secEl.dataset.section;
  const list=q.checks.filter(c=>c.section===sec);
  const p=list.filter(c=>c.result==='pass').length;
  const badge=secEl.querySelector('[data-section-badge]');
  if(badge)badge.textContent=`${p}/${list.length} PASS`;
 });
}

function wireXrite(t){
 const q=db.quality[t.id],x=q.xr;
 const fillEl=document.getElementById('deltaFill');
 const read=()=>['xrL','xrA','xrB'].map(id=>{const v=document.getElementById(id).value;return v===''?NaN:Number(v)});
 function calc(){
  const[l,a,b]=read();
  const box=document.getElementById('deltaResult');
  if(![l,a,b].every(Number.isFinite)){box.textContent='—';box.className='';fillEl.style.left='0%';return}
  const de=deltaE(x.ref,{l,a,b});
  box.textContent=de.toFixed(2);
  box.className=de<=QC_RULES.deltaEMax?'delta-good':'delta-bad';
  fillEl.style.left=clamp(de/3*100,0,100)+'%';
 }
 ['xrL','xrA','xrB'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
 calc();
 document.getElementById('xrPhoto').addEventListener('click',()=>document.getElementById('xrPhotoInput').click());
 document.getElementById('xrPhotoInput').addEventListener('change',ev=>{
  q.xr.photoCount=ev.target.files.length;
  previewFiles(ev.target.files,document.getElementById('xrPhotoPreview'),document.getElementById('xrPhoto'),'ảnh máy đo');
 });
 document.getElementById('cancelTask').addEventListener('click',()=>setRoute('work'));
 document.getElementById('saveXrite').addEventListener('click',()=>{
  const[l,a,b]=read();
  const box=document.getElementById('xrValidation');
  if(![l,a,b].every(Number.isFinite)){box.innerHTML=validationBanner(['Nhập đủ L*, a*, b* trước khi gửi.']);return}
  box.innerHTML='';
  // Lần gửi lại (sau khi bị trả phiếu) ghi đè đúng mốc cũ, không nhảy sang mốc sau.
  const row=xrTargetRow(t,x);
  Object.assign(row,{l,a,b});
  t.xrRowDay=row.day;
  const de=deltaE(x.ref,row);
  let n=null;
  if(de>QC_RULES.deltaEMax){
   n=createNCR({po:t.po,kind:'color',severity:'major',group:'Paint',stage:'paint_color',title:`ΔE ${de.toFixed(2)} vượt ngưỡng ${QC_RULES.deltaEMax.toFixed(1)} · mốc ${row.day} ngày`,
    qty:0,reason:`L* ${l} · a* ${a} · b* ${b}`,photos:q.xr.photoCount||0,sourceTaskId:t.id});
  }
  let next=null;
  const nxt=x.milestones.find(r=>r.l==null&&r.day>row.day);
  if(nxt&&!t.nextXrTaskId){
   const id=uid('XR');
   next={id,kind:'quality',template:'Color / X-Rite',po:t.po,title:`Đo màu ${POS[t.po].color} · mốc ${nxt.day} ngày`,stage:'Paint',due:relDay(nxt.day-row.day),
    status:'open',priority:'medium',assignee:t.assignee,desc:`Tự tạo sau khi đo mốc ${row.day} ngày.`};
   db.tasks.unshift(next);
   db.quality[id]={xr:clone(x)};
   t.nextXrTaskId=id;
  }
  submitTask(t,[
   `Mốc ${row.day} ngày · L* ${l} · a* ${a} · b* ${b}`,
   `ΔE ${de.toFixed(2)} — ${de<=QC_RULES.deltaEMax?'đạt':'không đạt'} (ngưỡng ${QC_RULES.deltaEMax.toFixed(1)})`,
   n?`Mở ${n.id} · ${n.title}`:'',
   next?`Đã tạo việc mốc ${nxt.day} ngày, hạn ${fmtVN(next.due)}`:''
  ].filter(Boolean));
  logHistory('droplet','X-Rite',`Mốc ${row.day} ngày · ΔE ${de.toFixed(2)}`,t.po);
  save();
  toast(n?`ΔE ${de.toFixed(2)} vượt ngưỡng · đã mở ${n.id}`:'Đã gửi kết quả X-Rite');
  setTimeout(()=>setRoute('work'),500);
 });
}

    <div><small>Style · Màu</small><span>${esc([p.style,p.color].filter(Boolean).join(' · ')||'—')}</span></div>
    <div><small>Số lượng</small><span>${fmt(p.qty)} pcs</span></div>
    <div><small>ETD</small><span>${fmtVN(p.etd)}${days!=null?` <span class="helper">(${days>=0?'còn '+days+' ngày':'trễ '+(-days)+' ngày'})</span>`:''}</span></div>
    <div><small>Nhà máy</small><span>${esc(p.factory||'—')}</span></div>
    <div><small>Tình trạng</small><span style="color:${openNcrs(f.po).length?'var(--red)':'var(--green)'}">${openNcrs(f.po).length?`${openNcrs(f.po).length} NCR đang mở`:'Ổn định'}</span></div>
   </div>
  </div>`;
 }
 function renderKind(){
  modal.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('active',b.dataset.k===f.kind));
  const tpls=f.kind==='production'?TEMPLATE_OPTIONS_PRODUCTION:TEMPLATE_OPTIONS_QUALITY;
  if(!tpls.includes(f.template))f.template=tpls[0];
  document.getElementById('tplArea').innerHTML=f.kind==='production'
   ?`<p class="helper" style="margin:0">Template <b>Daily Production</b>${f.po?` · bắt đầu ở gate <b>${esc(currentGroupOf(f.po))}</b>`:''}.</p>`
   :`<span class="label">Template</span><div class="tpl-chips">${tpls.map(x=>`<button type="button" data-tpl="${esc(x)}" class="${x===f.template?'active':''}">${esc(x)}</button>`).join('')}</div>`;
  document.querySelectorAll('[data-tpl]').forEach(b=>b.addEventListener('click',()=>{f.template=b.dataset.tpl;renderAll()}));
 }
 function renderDue(){
  document.querySelectorAll('[data-due]').forEach(b=>b.classList.toggle('active',b.dataset.due===f.due));
  document.getElementById('newDue').value=f.due;
 }
 function renderDup(){
  const w=document.getElementById('dupWarn');
  const dup=f.po&&db.tasks.find(t=>t.po===f.po&&t.kind===f.kind&&t.template===f.template&&effectiveStatus(t)!=='completed');
  w.innerHTML=dup?`<div class="warn-inline">${icon('alertTriangle')}<span>PO này đã có việc <b>${esc(dup.template)}</b> đang mở (${esc(dup.assignee)}, hạn ${fmtVN(dup.due)}). <a data-open-dup="${esc(dup.id)}">Mở việc đó</a></span></div>`:'';
  const a=w.querySelector('[data-open-dup]');
  if(a)a.addEventListener('click',()=>{closeModal();setRoute('task/'+a.dataset.openDup)});
  document.getElementById('createTask').disabled=!f.po;
 }
 function renderAll(){renderPicker();renderKind();renderDue();renderDup()}
 refreshPOPicker=()=>{if(f.po&&!POS[f.po])f.po=null;renderPicker();renderKind();renderDup()};

 modal.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{f.kind=b.dataset.k;renderAll()}));
 document.querySelectorAll('[data-due]').forEach(b=>b.addEventListener('click',()=>{f.due=b.dataset.due;renderDue()}));
 document.getElementById('newDue').addEventListener('change',ev=>{f.due=ev.target.value||todayISO();renderDue()});
 document.getElementById('modalClose').addEventListener('click',closeModal);
 document.getElementById('cancelModal').addEventListener('click',closeModal);
 modal.addEventListener('click',ev=>{if(ev.target===modal)closeModal()});
 document.getElementById('createTask').addEventListener('click',()=>{
  if(!f.po){toast('Chọn PO trước khi tạo','err');return}
  const po=f.po,k=f.kind,tp=f.template,p=POS[po];
  const assignee=document.getElementById('newAssignee').value;
  const id=uid('T');
  const t={id,kind:k,template:tp,po,
   title:k==='production'?`Cập nhật tiến độ PO ${po}`:`${tp} · ${[p.style,p.color].filter(Boolean).join(' ')||po}`,
   stage:k==='production'?currentGroupOf(po):'',
   due:f.due,status:'open',priority:'medium',assignee,
   desc:k==='production'?'Cập nhật pcs công đoạn và điểm nghẽn.':'Thực hiện checklist theo template.'};
  db.tasks.unshift(t);
  if(k==='quality')db.quality[id]=(tp==='Color / X-Rite')?{xr:clone(XR_DEFAULT)}:{checks:clone(SAMPLE_CHECKS),photos:{whitewood:0,primer:0,paint:0,topcoat:0,detail:0}};
  logHistory('plusCircle',k==='production'?'Production':'Quality',`Tạo ${tp} · giao ${assignee}`,po);
  save();
  closeModal();
  toast('Đã tạo QC Check');
  setRoute('task/'+id);
 });
 renderAll();
 updateSyncUI();
}
function closeModal(){refreshPOPicker=null;const m=document.getElementById('modalWrap');m.classList.remove('show');m.innerHTML=''}

/* ===================== Installable app + on-device notifications =====================
   Everything below is self-contained in this one HTML file — no server, no separate
   service-worker file. That means "Add to Home Screen" (icon/name/standalone via the
   inlined manifest above) works fully, but true background push (waking a fully-closed
   app) is out of reach without a backend; this uses the plain Notification API instead,
   which fires while this tab/PWA is open or running in the background — good enough for
   an in-session demo, not a substitute for real push. */
function notifySupported(){return typeof Notification!=='undefined'}
function notifyPermission(){return notifySupported()?Notification.permission:'unsupported'}
function requestNotify(cb){
 if(!notifySupported())return;
 Notification.requestPermission().then(perm=>{
  if(perm==='granted')fireNotification('VHG QC Work Center','Thông báo đã được bật trên thiết bị này ✅');
  if(cb)cb();
 });
}
function fireNotification(title,body,opts){
 if(!notifySupported()||Notification.permission!=='granted')return;
 const payload=Object.assign({body,vibrate:[80,40,80]},opts||{});
 try{
  const n=new Notification(title,payload);
  n.onclick=()=>{try{window.focus()}catch(e){}n.close()};
 }catch(e){}
}
function seenAlertKeys(){return new Set(getLS('vhg_final_seen_alerts',[]))}
function saveSeenAlertKeys(set){setLS('vhg_final_seen_alerts',[...set])}
function checkAndNotify(){
 if(!notifySupported()||Notification.permission!=='granted')return;
 const seen=seenAlertKeys();
 let changed=false;
 computeAlerts().filter(a=>a.sev==='high').forEach(a=>{
  const key=`${a.po}|${a.kind}|${a.text}`;
  if(seen.has(key))return;
  seen.add(key);changed=true;
  fireNotification('VHG QC · Cần hành động',`${a.po}${a.group?' · '+a.group:''} — ${a.text}`,{tag:key});
 });
 if(changed)saveSeenAlertKeys(seen);
}
function sendTestNotification(){
 const alerts=computeAlerts();
 const top=alerts[0];
 const body=top?`${top.po}${top.group?' · '+top.group:''} — ${top.text}`:'Hệ thống đang hoạt động ổn định. Đây là thông báo demo từ VHG QC Work Center.';
 fireNotification('VHG QC · Thông báo demo',body,{tag:'demo-'+Date.now()});
}

window.addEventListener('hashchange',render);
window.addEventListener('online',render);
window.addEventListener('offline',render);
document.addEventListener('click',ev=>{
 if(!ev.target.closest('#searchBox')&&!ev.target.closest('#searchPop'))closeSearchPop();
 if(!ev.target.closest('#bellBtn')&&!ev.target.closest('#bellPop'))closeBell();
});
state.user=getLS('vhg_final_user',null);
render();
</script>
