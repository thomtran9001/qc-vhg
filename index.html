<style>
/* ===================== Reset & base ===================== */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--bg)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ===================== Design tokens ===================== */
:root{
  --bg:#f5f4f0;--bg-soft:#edebe6;
  --surface:#ffffff;--surface-2:#f8f7f4;--surface-3:#eceae4;--surface-hover:#f1f6f4;
  --line:#e4e1da;--line-2:#cfcbc2;
  --text:#1b2321;--muted:#5f6763;--muted2:#8f9692;
  --primary:#0e7c70;--primary-2:#0b6a60;--primary-soft:#e3f1ee;--primary-ink:#ffffff;
  --blue:#2f62d9;--teal:#0e8a83;
  --green:#18794e;--green-fill:#1f9d63;
  --amber:#9a5b00;--amber-fill:#e09a1a;
  --red:#c2362f;--red-fill:#d6453d;
  --shadow-sm:0 1px 2px rgba(27,35,33,.05);
  --shadow:0 6px 18px rgba(27,35,33,.07);
  --shadow-lg:0 20px 48px rgba(27,35,33,.16);
  --radius-sm:10px;--radius:14px;--radius-lg:18px;--radius-xl:22px;
  --fs-xs:12px;--fs-sm:13px;--fs-base:15px;--fs-md:16px;--fs-lg:20px;--fs-xl:28px;
  --sidebar-w:248px;
  --font-display:'Be Vietnam Pro',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0f1413;--bg-soft:#131a19;
  --surface:#171e1d;--surface-2:#1c2523;--surface-3:#24302e;--surface-hover:#1f2b29;
  --line:#2a3634;--line-2:#3c4b48;
  --text:#ecf1ef;--muted:#a1aca8;--muted2:#6f7c78;
  --primary:#3cc2b0;--primary-2:#2fae9d;--primary-soft:#173a35;--primary-ink:#06231f;
  --blue:#7a9cff;--teal:#4fd1c5;
  --green:#4cc98d;--green-fill:#36b277;
  --amber:#f0b24a;--amber-fill:#e8a332;
  --red:#f08079;--red-fill:#e35d55;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:0 26px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-size:var(--fs-base);line-height:1.5}
::selection{background:color-mix(in srgb,var(--primary) 26%,transparent)}
b,strong{font-weight:600}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:-.015em;margin:0}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fade-in{animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.tabular{font-variant-numeric:tabular-nums}

/* ===================== Primitives ===================== */
.btn{min-height:44px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .08s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn:hover{background:var(--surface-hover)}
.btn:active{transform:scale(.98)}
.btn.primary{border-color:var(--primary);color:var(--primary-ink);background:var(--primary)}
.btn.primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn.green{border-color:var(--green-fill);background:var(--green-fill);color:#fff}
.btn.green:hover{filter:brightness(.95)}
.btn.danger{border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--surface))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.outline{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.sm svg{width:16px;height:16px}
.btn.lg{min-height:52px;padding:12px 20px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:0 0 auto;position:relative;transition:.15s}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{color:var(--text);background:var(--surface-hover)}
.iconbtn.sm{width:36px;height:36px;border-radius:10px}
.iconbtn.sm svg{width:17px;height:17px}
.mobile-only{display:none}
.iconbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red-fill);border:2px solid var(--surface)}

.control{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--text);padding:11px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.control::placeholder{color:var(--muted2)}
.control:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent)}
.control[readonly]{background:var(--surface-2);color:var(--muted)}
textarea.control{min-height:84px;resize:vertical;line-height:1.5}
select.control{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 19px) center,calc(100% - 14px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
select.control:disabled{background-color:var(--surface-2);color:var(--muted)}
input[type=number].control{font-variant-numeric:tabular-nums}
.field{margin:0 0 14px}
.field>span,.label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 6px}
.helper{font-size:13px;color:var(--muted);line-height:1.55}
.err-text{font-size:13px;color:var(--red);font-weight:500;min-height:18px}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;letter-spacing:.02em}
.badge svg{width:13px;height:13px}
.b-primary{background:var(--primary-soft);color:var(--primary)}
.b-blue{background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue)}
.b-teal{background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal)}
.b-green{background:color-mix(in srgb,var(--green-fill) 13%,transparent);color:var(--green)}
.b-amber{background:color-mix(in srgb,var(--amber-fill) 17%,transparent);color:var(--amber)}
.b-red{background:color-mix(in srgb,var(--red-fill) 12%,transparent);color:var(--red)}
.b-gray{background:var(--surface-3);color:var(--muted)}
.flag-dot{width:8px;height:8px;border-radius:50%;background:var(--red-fill);display:inline-block;flex:0 0 auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px}
.card.raised{box-shadow:var(--shadow)}
.sectionhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.sectionhead>div:first-child{flex:1;min-width:0}
.sectionhead h2{font-size:17px;margin:0 0 3px}
.sectionhead p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.divider{height:1px;background:var(--line);margin:18px 0}
.progress{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;position:relative}
.progress>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .4s ease}
.progress.green>i{background:var(--green-fill)}
.progress.red>i{background:var(--red-fill)}
.progress.amber>i{background:var(--amber-fill)}
.progress.lg{height:10px}
.switch{position:relative;width:50px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--surface-3);border-radius:999px;border:1px solid var(--line-2);transition:.15s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:24px;height:24px;left:2px;top:2px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.switch input:checked+i{background:var(--red-fill);border-color:var(--red-fill)}
.switch input:checked+i:before{transform:translateX(20px);background:#fff}
.tooltip-wrap{position:relative}

/* ===================== Login ===================== */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 520px;background:var(--bg)}
.login-left{padding:40px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:var(--primary);color:#fff}
.login-left:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 600px at 110% 120%,rgba(255,255,255,.12),transparent 60%),radial-gradient(600px 400px at -10% -10%,rgba(0,0,0,.18),transparent 60%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brandmark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.brandmark svg{width:36px;height:36px}
.brandtext b{display:block;font-size:15px;letter-spacing:.08em;font-weight:700}
.brandtext small{display:block;color:var(--muted);font-size:9.5px;letter-spacing:.1em;margin-top:2px;font-weight:500}
.login-left .brandtext small{color:rgba(255,255,255,.7)}
.login-left .brandmark{background:rgba(255,255,255,.12)}
.login-copy{max-width:600px;margin:56px 0;position:relative;z-index:1}
.login-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;margin-bottom:20px;text-transform:uppercase}
.login-copy h1{font-size:44px;line-height:1.12;letter-spacing:-.03em;margin:0 0 16px;font-weight:700}
.login-copy h1 span{color:#bff1e8}
.login-copy p{font-size:16px;line-height:1.7;color:rgba(255,255,255,.82);max-width:500px}
.login-stats{display:flex;gap:28px;margin-top:28px}
.login-stats div b{display:block;font-size:28px;letter-spacing:-.02em}
.login-stats div span{display:block;font-size:13px;color:rgba(255,255,255,.72);margin-top:2px}
.login-visual{position:relative;z-index:1;max-width:640px}
.flow-card{border:1px solid rgba(255,255,255,.18);border-radius:var(--radius-lg);background:rgba(255,255,255,.08);padding:20px}
.flow-card h3{font-size:12px;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:.07em;margin:0 0 16px;font-weight:600}
.flow-steps{display:flex;align-items:flex-start}
.flow-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.flow-step .line{position:absolute;top:16px;left:50%;width:100%;height:2px;background:rgba(255,255,255,.22)}
.flow-step:last-child .line{display:none}
.flow-step.on .line{background:#bff1e8}
.flow-step .dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;position:relative;z-index:1}
.flow-step .dot svg{width:15px;height:15px}
.flow-step.on .dot{background:#bff1e8;color:var(--primary-2);border-color:transparent}
.flow-step.now .dot{background:#fff;color:var(--primary);border-color:transparent;box-shadow:0 0 0 5px rgba(255,255,255,.2)}
.flow-step span{font-size:12px;color:rgba(255,255,255,.85);font-weight:500;text-align:center}
.login-right{padding:40px;display:grid;place-items:center;background:var(--bg)}
.login-card{width:min(100%,440px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:32px;box-shadow:var(--shadow)}
.login-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.login-card h2{font-size:26px;margin:0 0 6px}
.login-card>p,.login-card-head p{font-size:14px;color:var(--muted);margin:0 0 22px}
.role-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.role-switch button{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;padding:12px 10px;text-align:left;transition:.15s;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.role-switch button svg{width:20px;height:20px;flex:0 0 auto}
.role-switch button.active{border-color:var(--primary);background:var(--primary-soft);color:var(--text)}
.role-switch button.active svg{color:var(--primary)}
.role-switch b{display:block;font-size:14px}
.role-switch small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.pw-wrap{position:relative}
.pw-wrap .control{padding-right:48px}
.pw-toggle{position:absolute;right:6px;top:6px;bottom:6px;width:38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:9px}
.pw-toggle:hover{background:var(--surface-3);color:var(--text)}
.pw-toggle svg{width:18px;height:18px}
.login-foot{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}

/* ===================== App shell ===================== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--line);z-index:40;display:flex;flex-direction:column}
.sidebrand{padding:20px 20px 12px}
.sidebrand .brandmark{width:34px;height:34px}
.sidebrand .brandmark svg{width:30px;height:30px}
.sidebrand .brandtext b{font-size:14px}
.sidebar-cta{padding:8px 14px 4px}
.nav{padding:4px 12px;flex:1;overflow:auto}
.navlabel{font-size:11px;letter-spacing:.1em;color:var(--muted2);font-weight:600;padding:18px 10px 8px;text-transform:uppercase}
.navitem{width:100%;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500;text-align:left;margin:2px 0;transition:.15s}
.navitem svg{width:20px;height:20px;flex:0 0 auto}
.navitem:hover{background:var(--surface-3);color:var(--text)}
.navitem.active{background:var(--primary-soft);color:var(--primary)}
.navcount{margin-left:auto;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--muted);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.navitem.active .navcount{background:var(--primary);color:var(--primary-ink)}
.sidefoot{border-top:1px solid var(--line);padding:12px}
.userchip{display:flex;align-items:center;gap:10px;padding:6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:13px;font-weight:600;flex:0 0 auto}
.userchip b{display:block;font-size:14px}
.userchip small{font-size:12px;color:var(--muted)}
.main{margin-left:var(--sidebar-w);min-height:100vh}
.topbar{height:calc(64px + env(safe-area-inset-top));position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:env(safe-area-inset-top) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left));gap:12px}
.global-search{width:380px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;color:var(--muted);display:flex;align-items:center;gap:10px;transition:.15s;position:relative}
.global-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent)}
.global-search svg{width:18px;height:18px;flex:0 0 auto}
.global-search input{border:0;background:transparent;outline:0;flex:1;font-size:14.5px;color:var(--text);min-width:0}
.global-search input::placeholder{color:var(--muted2)}
.global-search kbd{font-size:11px;color:var(--muted2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit}
.topactions{margin-left:auto;display:flex;gap:8px;align-items:center}
.pop{position:absolute;top:calc(100% + 10px);right:0;width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);z-index:55;overflow:hidden}
#bellPop,#searchPop{position:fixed;top:calc(64px + env(safe-area-inset-top) + 8px);right:max(20px,env(safe-area-inset-right));left:auto}
#searchPop{width:420px}
.pop-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.pop-head b{font-size:14.5px;display:flex;align-items:center;gap:8px}
.pop-head b svg{width:17px;height:17px}
.pop-list{max-height:420px;overflow:auto}
.pop-row{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.pop-row:hover{background:var(--surface-hover)}
.pop-row:last-child{border-bottom:0}
.pop-row .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.pop-row .ic svg{width:18px;height:18px}
.pop-row b{font-size:14px;display:block}
.pop-row p{font-size:13px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.pop-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}
.login-eyebrow svg{width:14px;height:14px}
.feedrow .acticon svg{width:18px;height:18px}
.content{max-width:1360px;margin:0 auto;padding:28px 32px 96px}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehead>div:first-child{flex:1;min-width:220px}
.pagehead h1{font-size:28px;letter-spacing:-.025em;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.pagehead p{font-size:14.5px;color:var(--muted);margin:0;line-height:1.5}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bottomnav{display:none}
/* PO sync pill (topbar) */
.syncbtn{display:inline-flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-size:13px;font-weight:500;color:var(--muted);transition:.15s}
.syncbtn:hover{background:var(--surface-hover);color:var(--text)}
.syncbtn i{width:8px;height:8px;border-radius:50%;background:var(--green-fill);box-shadow:0 0 0 3px color-mix(in srgb,var(--green-fill) 22%,transparent);flex:0 0 auto}
.syncbtn.offline i,.syncbtn.err i{background:var(--amber-fill);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber-fill) 22%,transparent)}
.syncbtn svg{width:17px;height:17px}
.syncbtn.loading svg,.spin{animation:spin .9s linear infinite}
.syncbtn b{color:var(--text);font-weight:500}

/* ===================== Filter chips / work list ===================== */
.chiprow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line-2)}
.chip.active{border-color:var(--primary);background:var(--primary-soft)}
.chip b{font-size:26px;letter-spacing:-.02em;line-height:1.1}
.chip span{font-size:13.5px;color:var(--muted);font-weight:500}
.chip.active span{color:var(--primary)}
.chip.tone-red b{color:var(--red)}
.filterbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.filterbar .field{margin:0;flex:1;min-width:220px;max-width:420px}
.segrow{display:inline-flex;gap:4px;background:var(--surface-3);border-radius:12px;padding:4px;overflow:auto}
.seg{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 16px;font-size:14px;font-weight:500;white-space:nowrap;flex:0 0 auto;min-height:38px}
.seg.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.work-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.work-list{display:grid;gap:10px}
.work-group{margin-bottom:22px}
.work-group-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.work-group-head .n{font-size:12px;background:var(--surface-3);color:var(--muted);padding:1px 8px;border-radius:999px;letter-spacing:0}
.work-group-head.red{color:var(--red)}
.work-group-head.red .n{background:color-mix(in srgb,var(--red-fill) 12%,transparent);color:var(--red)}
.taskcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;transition:.15s;position:relative}
.taskcard:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:var(--shadow)}
.taskcard.is-overdue{border-left:4px solid var(--red-fill);padding-left:13px}
.taskcard.is-done{opacity:.66}
.taskicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--blue) 11%,var(--surface));color:var(--blue);flex:0 0 auto}
.taskicon svg{width:22px;height:22px}
.taskicon.quality{background:color-mix(in srgb,var(--teal) 12%,var(--surface));color:var(--teal)}
.taskicon.overdue{background:color-mix(in srgb,var(--red-fill) 12%,var(--surface));color:var(--red)}
.taskmain{min-width:0}
.taskmain h3{font-size:16px;margin:0 0 5px;display:flex;align-items:center;gap:8px}
.taskmain h3 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskmeta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.taskmeta .dotsep{width:4px;height:4px;border-radius:50%;background:var(--muted2)}
.taskmeta .mono{color:var(--text);font-weight:500}
.task-mini{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.task-mini .progress{width:120px;height:6px}
.taskright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.taskright small{display:block;font-size:12.5px;color:var(--muted);max-width:220px;line-height:1.4}
.task-cta{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--primary)}
.task-cta svg{width:16px;height:16px}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted)}
.empty-state svg{width:40px;height:40px;margin-bottom:10px;opacity:.5}
.empty-state b{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
.empty-state p{font-size:14px;margin:0}
.queuehint{padding:18px;position:sticky;top:84px}
.queuehint h3{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.queuehint h3 svg{width:18px;height:18px;color:var(--primary)}
.queuehint p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0}
.quicktype{display:grid;gap:10px;margin-top:16px}
.quicktype button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;color:var(--text);display:flex;align-items:center;gap:12px;transition:.15s}
.quicktype button:hover{border-color:var(--primary);background:var(--surface-hover)}
.quicktype .ic{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary);flex:0 0 auto}
.quicktype .ic svg{width:20px;height:20px}
.quicktype b{display:block;font-size:14.5px}
.quicktype span{font-size:12.5px;color:var(--muted)}

/* ===================== Task detail ===================== */
.task-page{max-width:980px}
.task-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.task-top .back{flex:0 0 auto}
.task-top-main{flex:1;min-width:0}
.task-top h1{font-size:24px;margin:0 0 2px}
.task-top p{font-size:14px;color:var(--muted);margin:0}
.task-status{display:flex;gap:7px;align-items:center;flex:0 0 auto}
.context-card{padding:18px;margin-bottom:18px}
.context-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.context-po{font-size:20px;font-weight:600}
.context-desc{font-size:14px;color:var(--muted);margin-top:3px}
.context-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.context-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.context-stat small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
.context-stat b{font-size:16px}
.bottleneck-note{margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--amber-fill) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--amber-fill) 28%,var(--line));font-size:14px;display:flex;gap:10px;align-items:flex-start}
.bottleneck-note svg{width:18px;height:18px;color:var(--amber);flex:0 0 auto;margin-top:2px}

.pipeline{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);overflow-x:auto;padding-bottom:4px}
.pipeline-row{display:flex;align-items:flex-start;min-width:560px}
.pipeline-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;padding:0 4px;min-width:96px}
.pipeline-step .line{position:absolute;top:19px;left:0;right:0;height:3px;background:var(--surface-3);z-index:0}
.pipeline-step:first-child .line{left:50%}
.pipeline-step:last-child .line{right:50%}
.pipeline-step.done .line{background:var(--green-fill)}
.pipeline-dot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;color:var(--muted);position:relative;z-index:1}
.pipeline-dot svg{width:18px;height:18px}
.pipeline-step.done .pipeline-dot{background:var(--green-fill);border-color:var(--green-fill);color:#fff}
.pipeline-step.active .pipeline-dot{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 18%,transparent)}
.pipeline-step.fail .pipeline-dot{background:var(--red-fill);border-color:var(--red-fill);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--red-fill) 18%,transparent)}
.pipeline-step b{font-size:13.5px;font-weight:600;text-align:center}
.pipeline-step span{font-size:12px;color:var(--muted);text-align:center}
.pipeline-step.fail span{color:var(--red);font-weight:500}

.task-section{margin:22px 0}
.task-section-title{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 2px 10px;display:flex;align-items:center;gap:9px}
.task-section-title .gi{width:26px;height:26px;border-radius:8px;background:var(--primary-soft);display:grid;place-items:center;color:var(--primary)}
.task-section-title .gi svg{width:15px;height:15px}
.stage-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.stage-card.done{border-color:color-mix(in srgb,var(--green-fill) 30%,var(--line))}
.stage-card.fail{border-color:color-mix(in srgb,var(--red-fill) 45%,var(--line));background:color-mix(in srgb,var(--red-fill) 3%,var(--surface))}
.stage-card.active{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.stage-card.touched{box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.stage-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.stage-num{width:32px;height:32px;border-radius:50%;background:var(--surface-3);color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:600;flex:0 0 auto}
.stage-num svg{width:16px;height:16px}
.done .stage-num{background:var(--green-fill);color:#fff}
.fail .stage-num{background:var(--red-fill);color:#fff}
.active .stage-num{background:var(--primary);color:var(--primary-ink)}
.stage-title{flex:1;min-width:0}
.stage-title b{font-size:15px;display:block}
.stage-title small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.stage-meter{display:flex;align-items:center;gap:8px;margin-top:7px}
.stage-meter .progress{flex:1;max-width:220px;height:6px}
.stage-meter span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-pct{font-size:14px;font-weight:600;color:var(--muted);flex:0 0 auto;min-width:44px;text-align:right}
.done .stage-pct{color:var(--green)}
.fail .stage-pct{color:var(--red)}
.active .stage-pct{color:var(--primary)}
.stage-quick{flex:0 0 auto;width:120px;position:relative}
.stage-quick input{min-height:44px;padding:8px 12px 8px 26px;text-align:right;font-weight:600}
.stage-quick:before{content:"+";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.chev{color:var(--muted2);flex:0 0 auto;transition:transform .2s;display:grid;place-items:center;width:28px;height:28px}
.chev svg{width:18px;height:18px}
.stage-body-wrap.collapsed,.collapse-wrap.collapsed{display:none!important}
.collapse-body{overflow:hidden;padding-top:12px;min-height:0}
.cp-head{cursor:pointer}
.stage-body{padding:0 16px 16px 60px}
.stage-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.mini-stat small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
.mini-stat b{font-size:16px}
.cluster-label{font-size:13px;font-weight:500;color:var(--muted);margin:14px 0 8px}
.clusters{display:flex;gap:8px;flex-wrap:wrap}
.cluster{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:500;transition:.15s;min-height:40px}
.cluster.ok{color:var(--green);border-color:color-mix(in srgb,var(--green-fill) 45%,var(--line));background:color-mix(in srgb,var(--green-fill) 9%,var(--surface))}
.cluster.bad{color:var(--red);border-color:color-mix(in srgb,var(--red-fill) 45%,var(--line));background:color-mix(in srgb,var(--red-fill) 9%,var(--surface))}
.issue-toggle{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.issue-toggle b{font-size:14.5px;font-weight:500}
.issue-toggle small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.issue-panel{margin-top:12px;padding:14px;border:1px solid color-mix(in srgb,var(--red-fill) 32%,var(--line));background:color-mix(in srgb,var(--red-fill) 4%,var(--surface));border-radius:14px}
.issue-panel h4{font-size:14px;color:var(--red);margin:0 0 12px;display:flex;align-items:center;gap:7px}
.issue-panel h4 svg{width:17px;height:17px}
.issue-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn-line{font-size:13px;color:var(--red);margin-top:6px;display:flex;gap:6px;align-items:center}
.warn-line svg{width:15px;height:15px;flex:0 0 auto}
.over-warn{font-size:12.5px;color:var(--amber);margin-top:6px;font-weight:500}

.photo-btn{min-height:52px;border:1.5px dashed var(--line-2);background:var(--surface);border-radius:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;padding:10px;width:100%;margin-top:12px;transition:.15s}
.measure-row .photo-btn{margin-top:0}
.photo-btn:hover{border-color:var(--primary);color:var(--primary)}
.photo-btn.has{border-style:solid;border-color:color-mix(in srgb,var(--green-fill) 45%,var(--line));color:var(--green);background:color-mix(in srgb,var(--green-fill) 8%,var(--surface))}
.photo-btn svg{width:19px;height:19px}
.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:10px}
.photo-preview:empty{display:none}
.photo-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);position:relative}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted2)}
.photo-thumb .ph svg{width:20px;height:20px}
.photo-thumb span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:1px 6px;border-radius:5px}
.sticky-save{position:sticky;bottom:0;z-index:16;background:linear-gradient(to top,var(--bg) 78%,transparent);padding:18px 0 8px;margin-top:16px;display:flex;gap:10px;flex-direction:column}
.sticky-save .row{display:flex;gap:10px;align-items:center}
.sticky-save .btn{min-height:52px;font-size:15px}
.sticky-save .row .btn:first-child{flex:0 0 auto}
.sticky-save .row .btn:last-child{flex:1}
.save-summary{font-size:13.5px;color:var(--muted);padding:0 4px}
.save-summary b{color:var(--text)}
.validation-banner{border:1px solid color-mix(in srgb,var(--red-fill) 38%,var(--line));background:color-mix(in srgb,var(--red-fill) 7%,var(--surface));border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.validation-banner svg{width:20px;height:20px;color:var(--red);flex:0 0 auto}
.validation-banner b{font-size:14.5px;color:var(--red);display:block;margin-bottom:3px}
.validation-banner ul{margin:0;padding-left:18px;font-size:13.5px}

/* ===================== Quality checklist ===================== */
.qc-score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px;margin-bottom:16px}
.score-ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto}
.score-ring:after{content:"";position:absolute;width:60px;height:60px;border-radius:50%;background:var(--surface)}
.score-ring b{position:relative;z-index:2;font-size:18px}
.qc-score h3{font-size:17px;margin:0 0 3px}
.qc-score p{font-size:13.5px;color:var(--muted);margin:0}
.check-section{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.check-section-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);gap:10px}
.check-section-head b{font-size:13.5px;letter-spacing:.02em}
.checkpoint{padding:14px 16px;border-bottom:1px solid var(--line)}
.checkpoint:last-child{border-bottom:0}
.cp-head{display:flex;align-items:center;gap:12px}
.cp-head>div:first-child{flex:1;min-width:0}
.cp-head b{font-size:15px}
.cp-head small{font-size:13px;color:var(--muted);display:block;margin-top:2px;line-height:1.45}
.measure-row{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;align-items:end}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pf button{min-height:52px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.pf button svg{width:20px;height:20px}
.pf button.pass.active{border-color:var(--green-fill);color:#fff;background:var(--green-fill)}
.pf button.fail.active{border-color:var(--red-fill);color:#fff;background:var(--red-fill)}
.fail-fields{margin-top:12px;border-left:3px solid var(--red-fill);padding-left:12px}
.photo-slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.photo-slot{border:1.5px dashed var(--line-2);border-radius:14px;padding:16px 8px;text-align:center;background:var(--surface);color:var(--muted);cursor:pointer;transition:.15s}
.photo-slot:hover{border-color:var(--primary)}
.photo-slot svg{width:22px;height:22px}
.photo-slot.has{border-style:solid;border-color:color-mix(in srgb,var(--green-fill) 45%,var(--line));color:var(--green);background:color-mix(in srgb,var(--green-fill) 8%,var(--surface))}
.photo-slot b{display:block;font-size:13px;margin-top:6px;color:var(--text)}
.photo-slot small{display:block;font-size:12px;margin-top:2px}
.photo-slot.req:not(.has) small{color:var(--red);font-weight:500}

/* ===================== X-Rite ===================== */
.xrite-table{width:100%;border-collapse:collapse;font-size:14px}
.xrite-table th,.xrite-table td{border-bottom:1px solid var(--line);padding:11px 10px;text-align:center}
.xrite-table th{color:var(--muted);background:var(--surface-2);font-size:12px;font-weight:500}
.xrite-table td:first-child{text-align:left;font-weight:500}
.xrite-table tr.due{background:color-mix(in srgb,var(--amber-fill) 9%,var(--surface))}
.xrite-table tr:not(.filled):not(.due) td{color:var(--muted2)}
.delta-box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.delta-box .mini-stat{text-align:center}
.delta-good{color:var(--green)}
.delta-bad{color:var(--red)}
.de-gauge{margin-top:14px}
.de-gauge .track{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--green-fill) 60%,var(--surface-3)) 0 33%,color-mix(in srgb,var(--red-fill) 55%,var(--surface-3)) 33% 100%)}
.de-gauge .mark{position:absolute;top:-4px;width:2px;height:20px;background:var(--text);opacity:.35}
.de-gauge .fill{position:absolute;top:-4px;width:14px;height:20px;border-radius:5px;background:var(--surface);border:3px solid var(--text);transform:translateX(-50%);transition:left .2s ease}
.de-gauge .labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* ===================== Dashboard / reports ===================== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi-grid.two{grid-template-columns:repeat(2,1fr)}
.kpi{padding:18px}
.kpi .kicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.kpi .kicon svg{width:20px;height:20px}
.kpi small{font-size:13.5px;color:var(--muted);display:block;font-weight:500}
.kpi b{font-size:30px;display:block;margin:4px 0 2px;letter-spacing:-.02em}
.kpi p{font-size:13px;color:var(--muted);margin:0}
.alertbox{border:1px solid color-mix(in srgb,var(--red-fill) 30%,var(--line));background:color-mix(in srgb,var(--red-fill) 4%,var(--surface));border-radius:18px;padding:16px 18px;margin-bottom:18px}
.alertbox-head{display:flex;align-items:center;gap:10px}
.alertbox-head svg{width:20px;height:20px;color:var(--red)}
.alertbox-head b{font-size:16px}
.inline-ic{display:inline-flex;vertical-align:-3px}
.inline-ic svg{width:15px;height:15px}
.alert-list{display:grid;gap:8px}
.alert-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;cursor:pointer;transition:.15s}
.alert-row:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.alert-row b{font-size:14.5px}
.alert-row p{font-size:13px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.report-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr);gap:16px}
.panelpad{padding:18px}
.po-table{width:100%;border-collapse:collapse;font-size:14px}
.po-table th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:11px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.po-table td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.po-table tr:last-child td{border-bottom:0}
.po-table tr.clickable:hover{background:var(--surface-hover);cursor:pointer}
.po-title{font-weight:600;color:var(--text)}
.cellbar{display:flex;align-items:center;gap:8px}
.cellbar .progress{width:44px;height:6px}
.cellbar b{font-size:13px;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.feedlist{display:grid}
.feedrow{display:grid;grid-template-columns:70px 40px minmax(0,1fr) 140px;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 2px}
.feedrow:last-child{border-bottom:0}
.feedrow time{font-size:12.5px;color:var(--muted);line-height:1.4;font-variant-numeric:tabular-nums}
.feedrow .acticon{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.feedrow b{font-size:14.5px;font-weight:500}
.feedrow p{font-size:12.5px;color:var(--muted);margin:2px 0}
.feedrow .who{font-size:13px;color:var(--muted);text-align:right}
.forecast-table td.slip-bad{color:var(--red);font-weight:600}
.forecast-table td.slip-warn{color:var(--amber);font-weight:600}
.forecast-table td.slip-good{color:var(--green);font-weight:600}

/* ===================== Modal / drawer / toast ===================== */
.overlay{position:fixed;inset:0;background:rgba(15,20,19,.42);z-index:70;display:none}
.overlay.show{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:80;transform:translateX(100%);transition:.24s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawerhead{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawerhead h2{font-size:22px;margin:8px 0 2px}
.drawerbody{padding:20px;overflow:auto;flex:1}
.drawerbody h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
.drawerfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.drawerfoot .btn{flex:1}
.sku-scroll{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.sku-scroll table{width:100%;border-collapse:collapse;font-size:13px}
.sku-scroll th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.sku-scroll td{padding:9px 10px;border-bottom:1px solid var(--line)}
.sku-scroll tr:last-child td{border-bottom:0}
.modalwrap{position:fixed;inset:0;z-index:90;background:rgba(15,20,19,.48);display:none;place-items:center;padding:16px}
.modalwrap.show{display:grid}
.modal{width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg)}
.modalhead,.modalfoot{padding:16px 20px;display:flex;align-items:center;gap:10px}
.modalhead{border-bottom:1px solid var(--line)}
.modalhead h2{font-size:19px;margin:0;flex:1}
.modalbody{padding:20px;overflow:auto;flex:1}
.modalfoot{border-top:1px solid var(--line);justify-content:flex-end}
.modalfoot .btn{min-width:120px}
.toast{position:fixed;right:24px;bottom:24px;z-index:120;background:#1b2321;color:#fff;border-radius:14px;padding:13px 18px;font-size:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;transform:translateY(8px);opacity:0;transition:.2s;pointer-events:none}
.toast svg{width:18px;height:18px;color:#6fe0a6;flex:0 0 auto}
.toast.show{transform:none;opacity:1}
.toast.err svg{color:#f2847d}

/* ===================== New QC Check: PO picker ===================== */
.step-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);margin:0 0 8px;white-space:nowrap}
.step-label .n{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:12px}
.step-label .meta{margin-left:auto;font-weight:500;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:normal;text-align:right;justify-content:flex-end}
.step{margin-bottom:20px}
.po-search{position:relative}
.po-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.po-search .control{padding-left:42px}
.po-summary{margin-top:10px;border:1px solid color-mix(in srgb,var(--primary) 30%,var(--line));background:var(--primary-soft);border-radius:14px;padding:14px}
.po-summary-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.po-summary-top b{font-size:16px}
.po-summary-top .badge{margin-left:auto}
.po-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.po-summary-grid small{display:block;font-size:12px;color:var(--muted)}
.po-summary-grid span{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind-pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;transition:.15s}
.kind-pick button .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:0 0 auto}
.kind-pick button .ic svg{width:20px;height:20px}
.kind-pick button b{display:block;font-size:14.5px}
.kind-pick button small{display:block;font-size:12.5px;color:var(--muted)}
.kind-pick button.active{border-color:var(--primary);background:var(--primary-soft)}
.kind-pick button.active .ic{background:var(--primary);color:var(--primary-ink)}
.tpl-chips,.quick-dates{display:flex;gap:8px;flex-wrap:wrap}
.tpl-chips button,.quick-dates button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;min-height:40px;color:var(--muted);transition:.12s}
.tpl-chips button.active,.quick-dates button.active{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.warn-inline{margin-top:10px;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--amber-fill) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--amber-fill) 30%,var(--line));font-size:13.5px}
.warn-inline svg{width:17px;height:17px;color:var(--amber);flex:0 0 auto;margin-top:1px}
.warn-inline a{color:var(--primary);font-weight:600;cursor:pointer}

/* ===================== Responsive ===================== */
@media(max-width:1100px){.work-layout{grid-template-columns:1fr}.work-layout aside{display:none}}
@media(max-width:900px){
 .drawerhead{padding-top:max(20px,env(safe-area-inset-top))}
 .modalfoot{padding-bottom:max(16px,env(safe-area-inset-bottom))}
 .search-sheet-head{padding-top:max(14px,env(safe-area-inset-top))}
 .login{grid-template-columns:1fr}
 .login-left{display:none}
 .login-right{padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));min-height:100vh}

.ncr-step:after{content:"";position:absolute;top:15px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--surface-3)}

/* ===================== PO sync (API) =====================
   Danh sách PO lấy từ API và cache ở localStorage. Cấu hình endpoint:
     - sửa PO_API.baseUrl bên dưới, hoặc
     - mở app với ?api=https://erp.example.com/api (lưu lại cho lần sau; ?api= để trống để xoá).
   Khi baseUrl trống, app dùng dữ liệu mẫu (giả lập độ trễ API) để demo.
   Response mong đợi: mảng PO, hoặc {data:[...]}. Mỗi PO chấp nhận các tên trường:
     po_no|po|id, customer, vendor, factory, style, color, qty|quantity, etd, value|amount,
     container, sku, items:[{sku,name,unit,qty,unit_price}] */
const PO_API={baseUrl:'',path:'/purchase-orders',token:'',autoSyncMinutes:30};
(function(){
 const q=new URLSearchParams(location.search);
 if(q.has('api')){const v=q.get('api').trim();v?setLS('vhg_api_base',v):delLS('vhg_api_base')}
 PO_API.baseUrl=getLS('vhg_api_base',PO_API.baseUrl)||'';
})();
const PO_SEED=clone(POS);
let PO_ITEMS_BY_PO={'PO00051551':PO_ITEMS};
let poSync=getLS('vhg_po_sync',{at:null,source:null,count:0,error:null});
let poSyncing=false;
(function loadPOCache(){
 const c=getLS('vhg_po_cache',null);
 if(c&&c.pos){Object.assign(POS,c.pos);PO_ITEMS_BY_PO=Object.assign({},PO_ITEMS_BY_PO,c.items||{})}
})();
function poItems(id){return PO_ITEMS_BY_PO[id]||[]}
function normalizePO(r){
 const id=String(r.po_no??r.po??r.id??'').trim();
 if(!id)return null;
 const items=(r.items||[]).map((it,i)=>({tt:i+1,name:it.name||it.sku||'',sku:it.sku||'',unit:it.unit||'',qty:Number(it.qty)||0,unit_price:Number(it.unit_price)||0}));
 return {id,items,po:{
  customer:r.customer||'—',vendor:r.vendor||'',factory:r.factory||'',style:r.style||'',color:r.color||'',
  qty:Number(r.qty??r.quantity)||items.reduce((s,it)=>s+it.qty,0),
  etd:String(r.etd||'').slice(0,10),value:Number(r.value??r.amount)||0,
  container:r.container||'',sku:r.sku||(items.length?items.length+' SKU':'')
 }};
}
async function fetchPOs(){
 if(!PO_API.baseUrl){
  await new Promise(res=>setTimeout(res,700));
  return Object.keys(PO_SEED).map(id=>Object.assign({po_no:id},PO_SEED[id],{items:id==='PO00051551'?PO_ITEMS:[]}));
 }
 const headers={Accept:'application/json'};
 if(PO_API.token)headers.Authorization='Bearer '+PO_API.token;
 const res=await fetch(PO_API.baseUrl.replace(/\/$/,'')+PO_API.path,{headers});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 return Array.isArray(j)?j:(j.data||j.items||[]);
}
async function syncPOs(opts){
 opts=opts||{};
 if(poSyncing)return;
 poSyncing=true;updateSyncUI();
 try{
  const rows=await fetchPOs();
  const map={},items={};
  rows.forEach(r=>{const n=normalizePO(r);if(n){map[n.id]=n.po;if(n.items.length)items[n.id]=n.items}});
  if(!Object.keys(map).length)throw new Error('API không trả về PO nào');
  // Merge, không xoá: việc QC cũ vẫn tham chiếu được PO đã đóng trên ERP.
  Object.assign(POS,map);
  Object.assign(PO_ITEMS_BY_PO,items);
  setLS('vhg_po_cache',{pos:Object.assign(getLS('vhg_po_cache',{pos:{}}).pos||{},map),items:Object.assign(getLS('vhg_po_cache',{items:{}}).items||{},items)});
  poSync={at:new Date().toISOString(),source:PO_API.baseUrl?'api':'mock',count:Object.keys(map).length,ids:Object.keys(map),error:null};
  if(!opts.silent)toast(`Đã đồng bộ ${poSync.count} PO`);
 }catch(e){
  poSync=Object.assign({},poSync,{error:String(e&&e.message||e)});
  if(!opts.silent)toast('Không đồng bộ được PO — đang dùng dữ liệu đã lưu','err');
 }finally{
  poSyncing=false;
  setLS('vhg_po_sync',poSync);
  updateSyncUI();
  if(opts.onDone)opts.onDone();
 }
}
function maybeAutoSync(){
 if(poSyncing||!navigator.onLine)return;
 const age=poSync.at?(Date.now()-new Date(poSync.at).getTime())/60000:Infinity;
 if(age>PO_API.autoSyncMinutes)syncPOs({silent:true,onDone:()=>{if(state.user&&!document.getElementById('modalWrap').classList.contains('show'))render()}});
}
function relTime(iso){
 if(!iso)return 'chưa đồng bộ';
 const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
 if(m<1)return 'vừa xong';
 if(m<60)return m+' phút trước';
 if(m<1440)return Math.round(m/60)+' giờ trước';
 return fmtVN(iso.slice(0,10));
}
function syncLabel(){
 if(poSyncing)return 'Đang đồng bộ PO…';
 if(!navigator.onLine)return 'Offline · dùng PO đã lưu';
 if(poSync.error&&!poSync.at)return 'Chưa đồng bộ được PO';
 return `PO cập nhật ${relTime(poSync.at)}`;
}
function updateSyncUI(){
 const b=document.getElementById('syncBtn');
 if(b){
  b.className=`syncbtn ${poSyncing?'loading':''} ${!navigator.onLine?'offline':''} ${poSync.error?'err':''}`;
  b.innerHTML=`${poSyncing?icon('refresh'):'<i></i>'}<span class="lbl">${esc(syncLabel())}</span>${poSyncing?'':icon('refresh')}`;
  b.title=poSync.error?'Lỗi lần đồng bộ gần nhất: '+poSync.error:'Bấm để đồng bộ lại danh sách PO';
 }
 const m=document.getElementById('poSyncMeta');
 if(m)m.innerHTML=`${esc(syncLabel())}${poSync.source==='mock'?' · dữ liệu mẫu':''} <button type="button" class="btn ghost sm" id="poSyncNow" ${poSyncing?'disabled':''}>${icon('refresh',poSyncing?'spin':'')}Làm mới</button>`;
 const r=document.getElementById('poSyncNow');
 if(r)r.addEventListener('click',()=>syncPOs({onDone:()=>{if(typeof refreshPOPicker==='function')refreshPOPicker()}}));
}

function clone(x){return JSON.parse(JSON.stringify(x))}
function getLS(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}}
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function delLS(k){try{localStorage.removeItem(k)}catch(e){}}

function fmt(n){return Number(n||0).toLocaleString('vi-VN')}
function money(v){return '$'+Number(v||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function money2(v){return '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(n){return Math.max(0,Math.min(100,Math.round(n)))}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function relDay(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtVN(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function initials(name){return (name||'').trim().split(/\s+/).map(x=>x[0]).slice(-2).join('').toUpperCase()}
function uid(prefix){return prefix+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}

function toast(t,kind){const el=document.getElementById('toast');el.innerHTML=icon(kind==='err'?'alertTriangle':'check')+`<span>${esc(t)}</span>`;el.classList.toggle('err',kind==='err');el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}

function groupOf(key){const s=STAGE_DEFS.find(s=>s.key===key);return s?s.group:null}
function stagesInGroup(group){return STAGE_DEFS.filter(s=>s.group===group)}
function stageRatio(pr,p,key){return p.qty?clamp((pr[key]||0)/p.qty,0,1):0}
function stuckGroupsOf(pr){return (pr&&pr.stuckGroups)||[]}
function stageStatus(pr,p,def){
 const v=pr[def.key]||0;
 if(v>=p.qty&&p.qty>0)return 'done';
 if(stuckGroupsOf(pr).includes(def.group))return 'fail';
 if(v>0)return 'active';
 return 'pending';
}
function groupSummary(pr,p){
 const stuck=stuckGroupsOf(pr);
 return GROUP_ORDER.map(g=>{
  const meta=GROUP_META[g];
  const ratio=stageRatio(pr,p,meta.rep);
  const anyStarted=stagesInGroup(g).some(s=>(pr[s.key]||0)>0);
  let status='pending';
  if(ratio>=1)status='done';
  else if(stuck.includes(g))status='fail';
  else if(anyStarted)status='active';
  return {group:g,icon:meta.icon,ratio,pct:pct(ratio*100),status,pcs:pr[meta.rep]||0};
 });
}
function overallPercent(pr,p){
 const gs=groupSummary(pr,p);
 return pct(gs.reduce((s,g)=>s+g.ratio,0)/gs.length*100);
}
function deltaE(ref,x){return Math.sqrt(Math.pow(x.l-ref.l,2)+Math.pow(x.a-ref.a,2)+Math.pow(x.b-ref.b,2))}
function nextXrRow(rows){return rows.find(r=>r.l==null)||rows[rows.length-1]}
function cutoffPassed(){const[h,m]=QC_RULES.cutoff.split(':').map(Number);const d=new Date();return d.getHours()*60+d.getMinutes()>=h*60+m}
function effectiveStatus(t){
 if(t.status==='completed')return 'completed';
 const d=todayISO();
 if(t.due<d)return 'overdue';
 // Việc tiến độ hằng ngày quá giờ chốt mà chưa nhập thì tính quá hạn.
 if(t.due===d)return t.kind==='production'&&cutoffPassed()?'overdue':'today';
 return 'upcoming';
}
function statusBadge(st){
 if(st==='overdue')return {cls:'b-red',label:'QUÁ HẠN'};
 if(st==='today')return {cls:'b-primary',label:'HÔM NAY'};
 if(st==='completed')return {cls:'b-green',label:'HOÀN TẤT'};
 return {cls:'b-gray',label:'SẮP TỚI'};
}
function isPendingReview(t){return t.status==='completed'&&!!t.review&&t.review.status==='pending'}
function reviewBadge(t){
 if(isPendingReview(t))return {cls:'b-amber',label:'CHỜ DUYỆT'};
 if(t.status==='completed'&&t.review&&t.review.status==='approved')return {cls:'b-green',label:'ĐÃ DUYỆT'};
 return null;
}
function myTasks(){return canReview()?db.tasks:db.tasks.filter(t=>t.assignee===user().name)}
function myPOSet(){return new Set(myTasks().map(t=>t.po))}
function computeAlerts(poFilter){
 const out=[];
 const scope=canReview()?null:myPOSet();
 const inScope=po=>!(scope&&!scope.has(po))&&!(poFilter&&po!==poFilter);
 db.ncrs.filter(isNcrOpen).forEach(n=>{
  if(!inScope(n.po))return;
  const od=ncrOverdue(n);
  const sev=n.severity==='critical'||od?'high':n.severity==='major'?'medium':'low';
  out.push({po:n.po,text:`${n.id} · ${n.title} — ${NCR_STATUS[n.status].label}${od?', quá hạn xử lý':''}`,group:n.group,pcs:n.qty,sev,kind:'ncr',ncrId:n.id});
 });
 db.tasks.forEach(t=>{
  if(!inScope(t.po))return;
  if(effectiveStatus(t)==='overdue'){
   out.push({po:t.po,text:`${t.title} — ${t.due===todayISO()?'qua giờ chốt '+QC_RULES.cutoff:'quá hạn từ '+fmtVN(t.due)}`,group:t.template,pcs:0,sev:'high',kind:'overdue',taskId:t.id});
  }
 });
 const order={high:0,medium:1,low:2};
 out.sort((a,b)=>order[a.sev]-order[b.sev]||b.pcs-a.pcs);
 return out;
}
function computeOrderTotals(){
 const ids=Object.keys(POS);
 const totalQty=ids.reduce((s,id)=>s+(POS[id].qty||0),0);
 const totalValue=ids.reduce((s,id)=>s+(POS[id].value||0),0);
 return {totalQty,totalValue};
}

/* ===================== QC workflow: NCR · phiếu & duyệt · việc hằng ngày ===================== */
function pad2(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function nowISO(){return new Date().toISOString()}
function addHours(iso,h){return new Date(new Date(iso).getTime()+h*3600000).toISOString()}
function fmtDT(iso){if(!iso)return '—';const d=new Date(iso);return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function nextWorkday(iso){const d=new Date(iso+'T00:00:00');do{d.setDate(d.getDate()+1)}while(!QC_RULES.workdays.includes(d.getDay()));return ymd(d)}
function isNcrOpen(n){return n.status!=='closed'}
function openNcrs(po){return db.ncrs.filter(n=>n.po===po&&isNcrOpen(n))}
function ncrById(id){return db.ncrs.find(n=>n.id===id)}
function ncrRespondBy(n){return addHours(n.createdAt,QC_RULES.sla[n.severity].respondH)}
function ncrOverdue(n){
 if(n.status==='open')return Date.now()>new Date(ncrRespondBy(n)).getTime();
 if(n.status==='fixing')return !!n.dueAt&&Date.now()>new Date(n.dueAt).getTime();
 return false;
}
function ncrDueText(n){
 if(n.status==='open')return 'Phản hồi trước '+fmtDT(ncrRespondBy(n));
 if(n.status==='fixing')return 'Hạn sửa '+fmtDT(n.dueAt);
 if(n.status==='fixed')return 'Chờ QC kiểm lại';
 if(n.status==='verified')return 'Chờ QC trưởng đóng';
 return 'Đã đóng '+fmtDT(n.closedAt);
}
// Tiến độ đọc pr.stuck / pr.stuckGroups; hai trường này luôn được tính lại từ NCR đang mở.
function syncIssues(po){
 const pr=db.progress[po]||(db.progress[po]={});
 const open=openNcrs(po);
 pr.stuck=open.reduce((s,n)=>s+(n.qty||0),0);
 pr.stuckGroups=[...new Set(open.filter(n=>n.severity!=='minor').map(n=>n.group))];
 const top=open.slice().sort((a,b)=>(b.qty||0)-(a.qty||0))[0];
 pr.stuckStage=top?top.group:'';
 pr.issue=top?top.title:'';
}
function blockingNcr(po,group){
 const gi=GROUP_ORDER.indexOf(group);
 return openNcrs(po).find(n=>n.severity==='critical'||(n.severity==='major'&&GROUP_ORDER.indexOf(n.group)<gi));
}
function ncrGroupFor(t){return GROUP_ORDER.includes(t.stage)?t.stage:t.stage==='Final'?'Packing':currentGroupOf(t.po)}
function ncrLog(n,text){n.log.push({at:nowISO(),who:user()?user().name:'Hệ thống',text})}
function createNCR(o){
 db.ncrSeq=(db.ncrSeq||0)+1;
 const n={id:'NCR-'+String(db.ncrSeq).padStart(4,'0'),po:o.po,kind:o.kind,severity:o.severity||'major',group:o.group,stage:o.stage||'',
  title:o.title,qty:Number(o.qty)||0,reason:o.reason||'',action:o.action||'',photos:o.photos||0,sourceTaskId:o.sourceTaskId||null,
  checkIds:o.checkIds||[],status:'open',owner:'',createdAt:nowISO(),createdBy:user().name,dueAt:null,loops:0,recheckTaskId:null,log:[]};
 ncrLog(n,'Mở NCR'+(o.sourceTaskId?` từ phiếu ${o.sourceTaskId}`:''));
 db.ncrs.unshift(n);
 syncIssues(n.po);
 logHistory('alertTriangle','NCR',`Mở ${n.id} · ${n.title}`,n.po);
 return n;
}
function assignNCR(n,owner){
 n.owner=owner;n.status='fixing';
 n.dueAt=addHours(nowISO(),24*QC_RULES.sla[n.severity].fixDays);
 ncrLog(n,`Giao ${owner} · hạn sửa ${fmtDT(n.dueAt)}`);
 logHistory('users','NCR',`${n.id} giao ${owner}`,n.po);
}
function createRecheckTask(n){
 const srcTask=db.tasks.find(x=>x.id===n.sourceTaskId);
 const src=db.quality[n.sourceTaskId];
 let checks=[];
 if(n.kind==='quality'&&src&&src.checks){
  checks=src.checks.filter(c=>(n.checkIds||[]).includes(c.id)).map(c=>({id:c.id,section:'RE-CHECK · '+n.id,name:c.name,spec:c.spec,type:c.type,unit:c.unit,value:'',result:'',photoRequired:true}));
 }
 if(!checks.length)checks=[{id:'fix',section:'RE-CHECK · '+n.id,name:n.kind==='color'?'Đo lại màu sau khi sơn sửa':'Xác nhận đã khắc phục',
  spec:n.kind==='color'?`ΔE ≤ ${QC_RULES.deltaEMax.toFixed(1)} so với chuẩn`:n.title,type:'text',value:'',result:'',photoRequired:true}];
 const id=uid('RC');
 const t={id,kind:'quality',template:'Re-check',po:n.po,ncrId:n.id,title:`Re-check ${n.id} · ${n.title}`,stage:n.group,due:todayISO(),status:'open',
  priority:n.severity==='minor'?'medium':'high',assignee:srcTask?srcTask.assignee:USERS.field.name,desc:`Kiểm lại các điểm lỗi sau khi ${n.owner||'xưởng'} sửa.`};
 db.tasks.unshift(t);
 db.quality[id]={checks,photos:{}};
 n.recheckTaskId=id;
 return t;
}
function markNcrFixed(n,note){
 n.status='fixed';
 ncrLog(n,'Xưởng báo đã sửa'+(note?': '+note:''));
 const t=createRecheckTask(n);
 ncrLog(n,`Tạo việc Re-check ${t.id}`);
 logHistory('wrench','NCR',`${n.id} đã sửa, chờ re-check`,n.po);
 return t;
}
function applyRecheckResult(t,q){
 const n=ncrById(t.ncrId);
 if(!n)return null;
 const pass=q.checks.every(c=>c.result==='pass');
 if(pass){n.status='verified';ncrLog(n,`Re-check ${t.id} đạt`)}
 else{
  n.status='fixing';n.loops=(n.loops||0)+1;n.recheckTaskId=null;
  n.dueAt=addHours(nowISO(),24*QC_RULES.sla[n.severity].fixDays);
  ncrLog(n,`Re-check ${t.id} không đạt — trả về ${n.owner||'xưởng'} (vòng ${n.loops+1})`);
 }
 return pass;
}
function closeNCR(n){
 n.status='closed';n.closedAt=nowISO();
 ncrLog(n,'Đóng NCR, mở lại gate');
 syncIssues(n.po);
 logHistory('checkCircle','NCR',`Đóng ${n.id}`,n.po);
}
function submitTask(t,summary){
 t.status='completed';t.submittedAt=nowISO();t.submittedBy=user().name;t.summary=summary;
 // Phiếu QC cần QC trưởng duyệt; báo cáo tiến độ hằng ngày chỉ ghi nhận.
 t.review=t.kind==='production'?null:{status:'pending'};
 delete t.returnNote;
}
function reviewTask(t,ok,note){
 t.review={status:ok?'approved':'returned',by:user().name,at:nowISO(),note:note||''};
 if(!ok){t.status='open';t.returnNote=note}
 logHistory(ok?'checkCircle':'back','Duyệt',`${ok?'Duyệt':'Trả lại'} phiếu ${t.template}${note?': '+note:''}`,t.po);
}
function ensureNextDaily(t){
 const po=t.po,p=POS[po],pr=db.progress[po]||{};
 if(p&&p.qty&&(pr.packing||0)>=p.qty)return null;
 if(db.tasks.some(x=>x.kind==='production'&&x.po===po&&x.status!=='completed'))return null;
 const n={id:uid('P'),kind:'production',template:'Daily Production',po,title:`Cập nhật tiến độ PO ${po}`,stage:currentGroupOf(po),
  due:nextWorkday(todayISO()),status:'open',priority:openNcrs(po).length?'high':'medium',assignee:t.assignee,desc:'Việc hằng ngày, tự tạo khi lưu ngày trước.'};
 db.tasks.unshift(n);
 return n;
}

 if(path.startsWith('task/'))state.taskId=path.split('/')[1];

  dashboard();

 }
}

function computeSearchMatches(q){
 q=(q||'').trim().toLowerCase();
 if(!q)return[];
 const tasks=myTasks().filter(t=>{
  const p=POS[t.po]||{};
  return[t.title,t.po,t.template,t.assignee,p.customer,p.sku,p.style,p.color].some(v=>String(v||'').toLowerCase().includes(q));
 }).map(t=>({type:'task',id:t.id,title:t.title,sub:`${t.po} · ${POS[t.po]?POS[t.po].customer:''}`}));
 let pos=[];
 if(canReview()){
  pos=Object.keys(POS).filter(id=>{
   const p=POS[id];
   return[id,p.customer,p.sku,p.style,p.color].some(v=>String(v||'').toLowerCase().includes(q));
  }).map(id=>({type:'po',id,title:id,sub:`${POS[id].customer} · ${POS[id].style} ${POS[id].color}`}));
 }
 return tasks.concat(pos).slice(0,8);
}

 const pr=db.progress[t.po]||(db.progress[t.po]={});
 const overall=overallPercent(pr,p);
 const open=openNcrs(t.po);
 return `<div class="card context-card">

   <div class="context-stat"><small>Order Qty</small><b>${fmt(p.qty)} pcs</b></div>

function pipelineStepper(pr,p){

 return `<div class="pipeline"><div class="pipeline-row">${gs.map(g=>`

/* ===================== Phiếu đã gửi (khóa) + duyệt ===================== */

    ${rv?`<span class="badge ${rv.status==='approved'?'b-green':'b-amber'}">${rv.status==='approved'?'ĐÃ DUYỆT':'CHỜ DUYỆT'}</span>`:'<span class="badge b-green">ĐÃ GHI NHẬN</span>'}</div>
   <ul class="summary-list">${(t.summary||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
   ${rv&&rv.status==='approved'?`<p class="helper">Duyệt bởi ${esc(rv.by)} lúc ${fmtDT(rv.at)}.</p>`:''}
   ${next?`<p class="helper">Việc tiến độ kế tiếp: <a href="#/task/${esc(next.id)}">hạn ${fmtVN(next.due)}</a>.</p>`:''}
  </div>
  ${detail}
  ${canAct?`<div class="sticky-save">
   <div id="reviewValidation"></div>
   <textarea id="reviewNote" class="control" placeholder="Lý do trả lại (bắt buộc khi trả lại)…"></textarea>
   <div class="row"><button id="rejectTask" class="btn danger">${icon('back')}Trả lại</button><button id="approveTask" class="btn green block">${icon('check')}Duyệt phiếu</button></div>
  </div>`:''}`;
}
function wireSubmitted(t){
 const ok=document.getElementById('approveTask');
 if(!ok)return;
 ok.addEventListener('click',()=>{reviewTask(t,true);save();toast('Đã duyệt phiếu');setRoute('work')});
 document.getElementById('rejectTask').addEventListener('click',()=>{
  const note=document.getElementById('reviewNote').value.trim();
  if(!note){document.getElementById('reviewValidation').innerHTML=validationBanner(['Nhập lý do trả lại để QC biết cần sửa gì.']);return}
  reviewTask(t,false,note);save();toast('Đã trả phiếu về cho '+t.assignee);setRoute('work');
 });
}

/* ===================== Production Check form ===================== */
function productionForm(t){
 const pr=db.progress[t.po]||(db.progress[t.po]={});
 const p=POS[t.po];
 const sections=GROUP_ORDER.map(g=>`
  <div class="task-section">
   <div class="task-section-title"><span class="gi">${icon(GROUP_META[g].icon)}</span>${esc(g)}</div>
   ${stagesInGroup(g).map(s=>stageCard(t,s,pr,p)).join('')}
  </div>`).join('');
 return `<div class="card pad">
   <div class="sectionhead"><div><h2>Nhập tiến độ hôm nay</h2><p>Gõ số pcs <b>hoàn thành thêm hôm nay</b> vào ô “+” của từng công đoạn. Có lỗi hoặc kẹt thì mở công đoạn đó và bật “Phát sinh lỗi / kẹt” để mở NCR. Chốt số liệu lúc <b>${esc(QC_RULES.cutoff)}</b>.</p></div><span class="badge b-blue">HẰNG NGÀY</span></div>
  </div>
  ${sections}
  <div class="sticky-save">
   <div id="prodValidation"></div>
   <div class="save-summary" id="prodSummary">Chưa nhập số liệu nào.</div>
   <div class="row"><button id="cancelTask" class="btn">Quay lại</button><button id="saveProduction" class="btn primary block">${icon('check')}Lưu & chốt tiến độ hôm nay</button></div>
  </div>`;
}
function stageCard(t,s,pr,p){
 const status=stageStatus(pr,p,s);
 const val=pr[s.key]||0;
 const remain=Math.max(0,p.qty-val);
 const isRep=GROUP_META[s.group].rep===s.key;
 const ncrs=openNcrs(t.po).filter(n=>n.stage===s.key||(!n.stage&&isRep&&n.group===s.group));
 const block=status==='done'?null:blockingNcr(t.po,s.group);
 const ratio=pct(val/p.qty*100);
 const sevOpts=k=>['critical','major','minor'].map(x=>`<option value="${x}" ${x===k?'selected':''}>${QC_RULES.sla[x].label}</option>`).join('');
 return `<div class="stage-card ${status==='pending'?'':status}" data-stagecard="${s.key}">
  <div class="stage-head" data-toggle="${s.key}">
   <div class="stage-num">${status==='done'?icon('check'):status==='fail'?icon('x'):STAGE_DEFS.findIndex(x=>x.key===s.key)+1}</div>
   <div class="stage-title"><b>${esc(s.name)}</b>
    <div class="stage-meter"><div class="progress ${status==='done'?'green':status==='fail'?'red':''}"><i style="width:${ratio}%"></i></div><span>${fmt(val)} / ${fmt(p.qty)}</span></div>
   </div>
   <div class="stage-pct">${ratio}%</div>
   ${status==='done'?'':block?`<div class="stage-quick stage-blocked" title="Bị chặn bởi ${esc(block.id)}">${icon('lock')}Chặn · ${esc(block.id)}</div>`:`<div class="stage-quick"><input type="number" inputmode="numeric" min="0" class="control stage-delta" data-stage="${s.key}" data-remain="${remain}" placeholder="0" aria-label="Hoàn thành thêm hôm nay · ${esc(s.name)}"></div>`}
   <div class="chev" style="transform:rotate(${ncrs.length?180:0}deg)">${icon('chevronDown')}</div>
  </div>
  <div class="stage-body-wrap ${ncrs.length?'':'collapsed'}" data-wrap="${s.key}">
   <div class="stage-body">
    <p class="helper" style="margin:0 0 10px">${esc(s.sub)}</p>
    ${block?`<div class="bottleneck-note" style="margin:0 0 12px">${icon('lock')}<span>Gate bị chặn bởi <a href="#/ncr/${esc(block.id)}">${esc(block.id)}</a> (${esc(block.group)} · ${QC_RULES.sla[block.severity].label}). Chưa nhập được số lượng cho tới khi NCR được đóng.</span></div>`:''}
    <div class="stage-inputs">
     <div class="mini-stat"><small>Lũy kế hiện tại</small><b>${fmt(val)} pcs</b></div>
     <div class="mini-stat"><small>Còn lại</small><b>${fmt(remain)} pcs</b></div>
    </div>
    ${ncrs.length?`<div class="cluster-label">NCR đang mở ở công đoạn này</div><div class="ncr-mini-list">${ncrs.map(n=>`<a class="ncr-mini" href="#/ncr/${esc(n.id)}"><span class="badge ${SEV_BADGE[n.severity]}">${QC_RULES.sla[n.severity].label}</span><b class="mono">${esc(n.id)}</b><span class="t">${esc(n.title)}${n.qty?` · ${fmt(n.qty)} pcs`:''}</span><span class="badge ${NCR_STATUS[n.status].cls}">${NCR_STATUS[n.status].label}</span></a>`).join('')}</div>`:''}
    ${s.clusters.length?`<div class="cluster-label">Cụm / bộ phận đã kiểm</div><div class="clusters">${s.clusters.map(c=>{
      const ok=val>0;
      return `<button type="button" class="cluster ${ok?'ok':''}" data-cluster="${s.key}|${esc(c)}">${esc(c)} ${ok?'✓':''}</button>`;
    }).join('')}</div>`:''}
    <div class="issue-toggle">
     <div><b>Phát sinh lỗi / kẹt mới?</b><small>Bật để mở NCR mới cho công đoạn này</small></div>
     <label class="switch"><input type="checkbox" class="issue-check" data-stage="${s.key}"><i></i></label>
    </div>
    <div class="issue-panel hidden" data-issuepanel="${s.key}">
     <h4>${icon('alertTriangle')}NCR mới · ${esc(s.name)}</h4>
     <div class="issue-grid">
      <div class="field" style="margin:0"><span>Cụm / bộ phận lỗi</span><input class="control issue-part"></div>
      <div class="field" style="margin:0"><span>Số lượng lỗi / kẹt *</span><input type="number" inputmode="numeric" min="0" class="control issue-qty"></div>
     </div>
     <div class="field" style="margin:10px 0 0"><span>Mức độ</span><select class="control issue-sev">${sevOpts('major')}</select></div>
     <div class="field" style="margin:10px 0 0"><span>Lý do *</span><textarea class="control issue-reason"></textarea></div>
     <div class="field" style="margin:10px 0 0"><span>Hành động khắc phục đề xuất</span><input class="control issue-action"></div>
     <button type="button" class="photo-btn" data-photo-stage="${s.key}">${icon('camera')}Thêm ảnh lỗi / bằng chứng</button>
     <input type="file" accept="image/*" multiple class="hidden photo-input" data-photo-input="${s.key}">
     <div class="photo-preview" data-photo-preview="${s.key}"></div>
    </div>
   </div>
  </div>
 </div>`;
}
function wireProduction(t){
 const pr=db.progress[t.po];
 const p=POS[t.po];
 document.querySelectorAll('[data-toggle]').forEach(head=>{
  head.addEventListener('click',ev=>{
   if(ev.target.closest('.stage-quick'))return;
   const wrap=document.querySelector(`[data-wrap="${head.dataset.toggle}"]`);
   wrap.classList.toggle('collapsed');
   head.querySelector('.chev').style.transform=wrap.classList.contains('collapsed')?'rotate(0deg)':'rotate(180deg)';
  });
 });
 function refreshSummary(){
  let stages=0,pcs=0,over=0;
  document.querySelectorAll('.stage-delta').forEach(inp=>{
   const d=Math.max(0,Number(inp.value)||0);
   inp.closest('.stage-card').classList.toggle('touched',d>0);
   if(d>0){stages++;pcs+=d;if(d>Number(inp.dataset.remain))over++}
  });
  const issues=document.querySelectorAll('.issue-check:checked').length;
  const parts=[];
  parts.push(stages?`Đang nhập <b>+${fmt(pcs)} pcs</b> ở <b>${stages}</b> công đoạn`:'Chưa nhập số liệu nào');
  if(issues)parts.push(`<b style="color:var(--red)">${issues} NCR mới</b>`);
  if(over)parts.push(`<span style="color:var(--amber)">${over} công đoạn vượt số còn lại (sẽ giới hạn bằng tổng PO)</span>`);
  if(cutoffPassed())parts.push(`<span style="color:var(--amber)">đã qua giờ chốt ${esc(QC_RULES.cutoff)} — số liệu tính cho ngày ${fmtVN(nextWorkday(todayISO()))}</span>`);
  document.getElementById('prodSummary').innerHTML=parts.join(' · ')+'.';
 }
 document.querySelectorAll('.stage-delta').forEach(inp=>{
  inp.addEventListener('input',refreshSummary);
  inp.addEventListener('keydown',ev=>{
   if(ev.key!=='Enter')return;
   ev.preventDefault();
   const all=[...document.querySelectorAll('.stage-delta')];
   const next=all[all.indexOf(inp)+1];
   if(next)next.focus();else inp.blur();
  });
 });
 document.querySelectorAll('.issue-check').forEach(chk=>{
  chk.addEventListener('change',()=>{
   document.querySelector(`[data-issuepanel="${chk.dataset.stage}"]`).classList.toggle('hidden',!chk.checked);
   refreshSummary();
  });
 });
 document.querySelectorAll('[data-photo-stage]').forEach(btn=>{
  btn.addEventListener('click',()=>document.querySelector(`[data-photo-input="${btn.dataset.photoStage}"]`).click());
 });
 document.querySelectorAll('.photo-input').forEach(inp=>{
  inp.addEventListener('change',()=>{
   const key=inp.dataset.photoInput;
   previewFiles(inp.files,document.querySelector(`[data-photo-preview="${key}"]`),document.querySelector(`[data-photo-stage="${key}"]`),'ảnh');
  });
 });
 document.querySelectorAll('.cluster').forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('ok');c.classList.remove('bad')}));
 document.getElementById('cancelTask').addEventListener('click',()=>setRoute('work'));
 refreshSummary();
 document.getElementById('saveProduction').addEventListener('click',()=>{
  const checked=[...document.querySelectorAll('.issue-check:checked')];
  const errs=[];
  checked.forEach(chk=>{
   const panel=document.querySelector(`[data-issuepanel="${chk.dataset.stage}"]`);
   const name=(STAGE_DEFS.find(x=>x.key===chk.dataset.stage)||{}).name;
   if(!(Number(panel.querySelector('.issue-qty').value)>0))errs.push(`${name}: nhập số lượng lỗi/kẹt lớn hơn 0.`);
   if(!panel.querySelector('.issue-reason').value.trim())errs.push(`${name}: nhập lý do.`);
  });
  const box=document.getElementById('prodValidation');
  if(errs.length){box.innerHTML=validationBanner(errs);if(box.scrollIntoView)box.scrollIntoView({behavior:'smooth',block:'center'});return}
  box.innerHTML='';
  let pcs=0,stages=0;
  document.querySelectorAll('.stage-delta').forEach(inp=>{
   const d=Math.max(0,Number(inp.value)||0);
   const key=inp.dataset.stage;
   const before=pr[key]||0;
   pr[key]=Math.min(p.qty,before+d);
   if(pr[key]>before){pcs+=pr[key]-before;stages++}
  });
  const created=checked.map(chk=>{
   const s=chk.dataset.stage;
   const panel=document.querySelector(`[data-issuepanel="${s}"]`);
   const part=panel.querySelector('.issue-part').value.trim();
   const reason=panel.querySelector('.issue-reason').value.trim();
   return createNCR({po:t.po,kind:'bottleneck',severity:panel.querySelector('.issue-sev').value,group:groupOf(s),stage:s,
    title:(part?part+': ':'')+reason,qty:panel.querySelector('.issue-qty').value,reason,action:panel.querySelector('.issue-action').value.trim(),
    photos:panel.querySelectorAll('.photo-thumb').length,sourceTaskId:t.id});
  });
  const late=cutoffPassed();
  submitTask(t,[
   pcs?`+${fmt(pcs)} pcs ở ${stages} công đoạn`:'Không có số lượng mới',
   ...created.map(n=>`Mở ${n.id} · ${n.title} (${fmt(n.qty)} pcs)`),
   late?`Nhập sau giờ chốt ${QC_RULES.cutoff} — tính cho ngày ${fmtVN(nextWorkday(todayISO()))}`:''
  ].filter(Boolean));
  const next=ensureNextDaily(t);
  logHistory('work','Production',pcs?`Cập nhật tiến độ +${fmt(pcs)} pcs`:'Lưu tiến độ, không có số lượng mới',t.po);
  save();
  toast(next?`Đã lưu · việc ngày ${fmtVN(next.due)} đã được tạo`:'Đã lưu tiến độ hôm nay');
  setTimeout(()=>setRoute('work'),400);
 });
}

/* ===================== Quality Inspection form ===================== */
function scoreOf(checks){
 const total=checks.length;
 const passed=checks.filter(c=>c.result==='pass').length;
 return {passed,total,score:total?pct(passed/total*100):0};
}
function scoreColor(score){return score>=85?'var(--green-fill)':score>=60?'var(--amber-fill)':'var(--red-fill)'}
function qualityForm(t){
 const q=db.quality[t.id]||(db.quality[t.id]={});
 if(t.template==='Color / X-Rite'){q.xr=q.xr||clone(XR_DEFAULT);return xriteForm(t,q)}
 q.checks=q.checks||clone(SAMPLE_CHECKS);
 q.photos=q.photos||{whitewood:0,primer:0,paint:0,topcoat:0,detail:0};
 return renderQualityBody(t,q);
}
const EVIDENCE_SLOTS=[['whitewood','Hàng trắng',true],['primer','Sau sơn lót',true],['paint','Sau sơn phủ',true],['topcoat','Topcoat',true],['detail','Cận cảnh góc/cạnh',false]];
function renderQualityBody(t,q){
 const {score}=scoreOf(q.checks);
 const sections=[...new Set(q.checks.map(c=>c.section))];
 const recheck=t.template==='Re-check';
 return `<div class="card qc-score">
   <div class="score-ring" id="scoreRing" style="background:conic-gradient(${scoreColor(score)} 0 ${score}%, var(--surface-3) ${score}% 100%)"><b id="scoreText">${score}%</b></div>
   <div><h3>QC Score · ${esc(t.template)}</h3><p>Chấm từng checkpoint — điểm cập nhật ngay khi Pass/Fail. Mỗi checkpoint FAIL sẽ tự mở một NCR khi gửi phiếu.</p></div>
  </div>
  ${sections.map(sec=>{
   const list=q.checks.filter(c=>c.section===sec);
   const p=list.filter(c=>c.result==='pass').length;
   return `<div class="check-section" data-section="${esc(sec)}">
    <div class="check-section-head"><b>${esc(sec)}</b><span class="badge b-gray" data-section-badge>${p}/${list.length} PASS</span></div>
    ${list.map(checkpoint).join('')}
   </div>`;
  }).join('')}
  ${recheck?'':`<div class="check-section">
   <div class="check-section-head"><b>ẢNH SẢN PHẨM THEO BƯỚC / BỘ PHẬN</b><span class="badge b-blue">EVIDENCE</span></div>
   <div class="checkpoint"><div class="photo-slots">${EVIDENCE_SLOTS.map(([k,n,req])=>photoSlot(k,n,q.photos[k]||0,req)).join('')}</div></div>
  </div>`}
  <div class="sticky-save">
   <div id="qcValidation"></div>
   <div class="row"><button id="cancelTask" class="btn">Quay lại</button><button id="saveQuality" class="btn green block">${icon('check')}Gửi phiếu QC</button></div>
  </div>`;
}
function checkpoint(c){
 const badge=c.result==='pass'?{cls:'b-green',label:'PASS'}:c.result==='fail'?{cls:'b-red',label:'FAIL'}:{cls:'b-gray',label:'CHƯA CHẤM'};
